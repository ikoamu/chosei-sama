name: Deploy

# main への push で Cloudflare Workers へデプロイする。
# 必要な Secrets（Settings → Secrets and variables → Actions）:
#   CLOUDFLARE_API_TOKEN   … Workers のデプロイ権限を持つ API トークン
#   CLOUDFLARE_ACCOUNT_ID  … デプロイ先アカウント ID
# アプリの秘密（GOOGLE_SA_KEY など）は wrangler secret 側で管理し、ここには置かない。

on:
  push:
    branches:
      - main

# 同時デプロイを避け、最新の push を順番に反映する。
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 壊れたコードをデプロイしないよう、デプロイ前に型・lint・format を検証する。
      - run: pnpm run check

      # vite build && wrangler deploy
      - run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
