name: CI

# PR と main への push でマージ前ゲートを回す。
# ブランチ保護の Required status checks に "test" ジョブを指定すると、
# 失敗時にマージ不可になる（保護設定は別途リポジトリ設定で行う）。
on:
  pull_request:
  push:
    branches: [main]

# 同一 PR/ブランチで新しい push があれば古い実行を打ち切る。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # サプライチェーン保護のためアクションはコミット SHA で固定する（タグは可変）。
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # バージョンは package.json の packageManager フィールドから読む（version は指定しない）。
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # oxfmt --check && oxlint src/ && tsc
      - name: Check (format / lint / types)
        run: pnpm check

      # vitest run
      - name: Test
        run: pnpm test
